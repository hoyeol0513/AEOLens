spring.application.name=aeolens-api
server.port=${SERVER_PORT:8080}

spring.codec.max-in-memory-size=4MB
management.endpoints.web.exposure.include=health,info

spring.r2dbc.url=${R2DBC_URL:r2dbc:postgresql://localhost:5432/aeolens}
spring.r2dbc.username=${DB_USERNAME:aeolens}
spring.r2dbc.password=${DB_PASSWORD:aeolens}
spring.flyway.url=${JDBC_URL:jdbc:postgresql://localhost:5432/aeolens}
spring.flyway.user=${DB_USERNAME:aeolens}
spring.flyway.password=${DB_PASSWORD:aeolens}

aeolens.crawler.connect-timeout=3s
aeolens.crawler.response-timeout=10s
aeolens.crawler.max-content-length=4000000
aeolens.dynamic.navigation-timeout=15s
aeolens.dynamic.network-idle-timeout=5s
aeolens.history.limit=20
aeolens.history.retention=90d
aeolens.history.cleanup-cron=0 15 3 * * *
aeolens.guest.cookie-name=aeolens_guest
aeolens.guest.secure-cookie=${COOKIE_SECURE:false}
aeolens.gemini.api-key=${GEMINI_API_KEY:}
aeolens.gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
